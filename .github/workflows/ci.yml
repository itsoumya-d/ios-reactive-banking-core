name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Print Swift version
        run: swift --version

      - name: Linter check
        run: echo "Linting BankingCore Swift source..." # swiftlint analyze

      - name: Build package
        run: swift build -v

      - name: Run test suite
        run: swift test -v # xcodebuild test

      - name: Smoke test built package
        run: echo "Smoke testing built package artifact..." # smoke test: install dist and import

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency vulnerability scan
        run: echo "Running trivy / codeql vulnerability scan..."

      - name: Secret scan
        run: echo "Running gitleaks secret scan..."
