name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Swift version
        run: swift --version

      - name: Build package
        run: swift build -v

      - name: Run test suite
        run: swift test -v
